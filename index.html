<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4A4370">
  <title>Mirage</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spline+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="horizon" aria-hidden="true"></div>

  <header id="topnav" class="hidden">
    <span class="wordmark">Mirage</span>
    <nav>
      <button id="navWrite" class="btn quiet">Write</button>
      <button id="navList" class="btn quiet">Entries</button>
    </nav>
  </header>

  <main>
    <!-- Passphrase gate -->
    <section id="gate" class="hidden">
      <h2 class="view-title">A quiet place</h2>
      <p class="faint">Enter the passphrase to open your journal.</p>
      <input id="gateInput" type="password" autocomplete="current-password" placeholder="Passphrase">
      <p id="gateError" class="error hidden">That passphrase didn't work.</p>
      <button id="gateGo" class="btn primary">Open</button>
    </section>

    <!-- Write -->
    <section id="write" class="hidden">
      <p id="writeDate" class="faint small"></p>
      <textarea id="draft" placeholder="Start anywhere. Don't polish."></textarea>
      <div id="writeBar">
        <div class="bar-inner">
          <button id="lookupOpen" class="btn quiet">Reaching for a word?</button>
          <button id="finishBtn" class="btn primary" disabled>Finish writing</button>
        </div>
      </div>
    </section>

    <!-- Reflect -->
    <section id="reflect" class="hidden">
      <h2 class="view-title">Second pass</h2>
      <p id="reflectBusy" class="faint hidden">Reading it back…</p>
      <div id="reflectError" class="card hidden">
        <p>The reflection didn't come through. You can retry, or save the entry as-is.</p>
        <div class="row">
          <button id="retryBtn" class="btn ghost">Retry</button>
          <button id="saveNoReflBtn" class="btn primary">Save without reflection</button>
        </div>
      </div>
      <div id="reflectBody"></div>
      <div id="reflectActions" class="row hidden">
        <button id="saveBtn" class="btn primary">Save entry</button>
        <button id="keepWritingBtn" class="btn quiet">Keep writing</button>
      </div>
    </section>

    <!-- Entry list -->
    <section id="list" class="hidden">
      <p id="listBusy" class="faint hidden">Loading…</p>
      <div id="listEmpty" class="card centre hidden">
        <p class="serif italic faint">Nothing on the horizon yet.</p>
        <button id="firstEntryBtn" class="btn primary">Write the first entry</button>
      </div>
      <div id="listBody"></div>
      <!-- Sits outside #listBody, which is cleared on every load. Text set
           from MIRAGE_VERSION in js/app.js. -->
      <p id="versionTag" class="version"></p>
    </section>

    <!-- Entry detail -->
    <section id="detail" class="hidden">
      <button id="backBtn" class="btn quiet back">&larr; All entries</button>
      <p id="detailDate" class="faint small"></p>
      <p id="detailText" class="entry-text serif"></p>
      <div id="detailReflection"></div>
      <button id="deleteBtn" class="btn quiet danger">Delete entry</button>
    </section>
  </main>

  <!-- Word lookup drawer -->
  <div id="lookupOverlay" class="hidden">
    <div id="lookupDrawer">
      <div class="label">Reaching for a word</div>
      <textarea id="lookupInput" rows="2" placeholder="Describe the meaning or feeling…"></textarea>
      <div class="row">
        <button id="lookupGo" class="btn primary" disabled>Find words</button>
        <button id="lookupClose" class="btn quiet">Back to writing</button>
      </div>
      <p id="lookupError" class="error hidden">Couldn't fetch words. Try again.</p>
      <div id="lookupWords" class="chips"></div>
    </div>
  </div>

  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // updateViaCache: 'none' so js/version.js — imported by the service
      // worker — is revalidated on update checks rather than served from the
      // HTTP cache, which would hide a version bump.
      navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
    }
  </script>
</body>
</html>
